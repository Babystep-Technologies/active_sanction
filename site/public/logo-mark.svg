<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ActiveSanction">
  <!-- The seal, reduced to what survives at 16 pixels: the ring, the gem and
       the open ledger. The motto, the columns and the laurel are all in
       `public/logo.svg`, and all of them turn to grit at this size. -->
  <circle cx="32" cy="32" r="32" fill="#000c21"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#d9a642" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#d9a642" stroke-width="1"/>

  <!-- The gem, and four rays rather than the full sunburst. -->
  <g fill="none" stroke="#d9a642" stroke-width="1.4" stroke-linecap="round">
    <path d="M32,9.6 V12.4 M18.5,20.2 l2.8,2.6 M45.5,20.2 l-2.8,2.6"/>
  </g>
  <path d="M25.5,21.5 L28.6,17.6 H35.4 L38.5,21.5 L32,32 Z"
        fill="#61041d" stroke="#d9a642" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M25.5,21.5 H38.5" fill="none" stroke="#d9a642" stroke-width="1.1"/>

  <!-- The ledger, open. Two pages, a spine, and three rules a side: enough
       to read as a book, few enough to stay separate when it is small. -->
  <g fill="none" stroke="#d9a642" stroke-width="1.9" stroke-linejoin="round">
    <path d="M32,37 C27,33.4 20.6,32.4 14.5,33 V47.5 C20.6,46.9 27,47.9 32,51.5 Z"/>
    <path d="M32,37 C37,33.4 43.4,32.4 49.5,33 V47.5 C43.4,46.9 37,47.9 32,51.5 Z"/>
  </g>
  <g fill="none" stroke="#d9a642" stroke-width="1.1" stroke-linecap="round" opacity="0.85">
    <path d="M19,37.4 H27.5 M19,41 H27.5 M19,44.6 H27.5"/>
    <path d="M36.5,37.4 H45 M36.5,41 H45 M36.5,44.6 H45"/>
  </g>
</svg>
