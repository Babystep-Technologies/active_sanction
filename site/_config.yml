# The documentation site. Not the gem -- nothing here is packaged, and the
# gemspec's `dev_only` rule excludes this whole directory. `docs/` is the one
# that ships, and the site links into it rather than duplicating it (#102).

title: ActiveSanction
description: >-
  Screen a name against government sanctions lists, in Ruby, in your own
  process. The lists live on your disk, screening runs in your process, and no
  name you screen leaves it.

# The canonical URL, and the one decision on this page that is expensive to
# change later: every inbound link, every search result and the `canonical`
# tag on every page are built from it. The GitHub default is used because it
# is available today and costs nothing; moving to a custom domain means
# setting `url` here, dropping a `CNAME` file in this directory, and pointing
# DNS -- worth doing before launch rather than after, since a redirect chain
# from a dead github.io path is not something we would control.
url: https://babystep-technologies.github.io
baseurl: /active_sanction
repository: Babystep-Technologies/active_sanction

# Just the Docs gives a sidebar, client-side search and anchored headings, and
# very little else. A heavier theme would be more to keep in step with content
# that four other issues are still writing.
theme: just-the-docs

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Diátaxis is the authoring discipline; these are the reader's words for the
# same four boxes. Nothing in the navigation says "tutorial" or "how-to" --
# a reader does not arrive wanting a quadrant, they arrive wanting to start,
# to do something, to look something up, or to understand why (#102).
#
# The section titles live in each directory's index page, and their order is
# the `nav_order` there.

# YARD output is generated into `doc/` by `rake doc` and copied under `/api/`
# during deploy, so it is not a page Jekyll knows about. An external nav entry
# is how it reaches the sidebar without Jekyll trying to render 600 files.
nav_external_links:
  - title: API docs
    url: /active_sanction/api/
    hide_icon: true

aux_links:
  GitHub: https://github.com/Babystep-Technologies/active_sanction

search_enabled: true
search:
  heading_level: 3
  previews: 2

heading_anchors: true

# Just the Docs renders `{: .warning }` as a plain blockquote unless the
# callout is declared here. The disclaimer is the one piece of prose on this
# site that must not read like an aside, so it gets declared.
callouts:
  warning:
    title: A screening aid, not legal advice
    color: red
  note:
    title: Note
    color: blue


color_scheme: light

# A screening library is not a place to be coy about what it is not. The
# footer carries the disclaimer on every page, because a reader who lands on
# one reference table from a search engine never sees the landing page.
footer_content: >-
  ActiveSanction is a screening aid. It is not legal advice and it is not a
  compliance program. Verify every hit against the official published list
  before acting on it, and treat a clean result as <em>nothing over the
  threshold in the lists we currently hold</em> rather than as a clearance.

exclude:
  - Gemfile
  - Gemfile.lock
  - bin/
  - vendor/
  - README.md
