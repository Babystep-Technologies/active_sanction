name: Release

# Publishing `active_sanction` to rubygems.org, triggered by a tag and
# authenticated with no key at all.
#
# The trigger is a `v*` tag rather than a push to `main`, because a release is
# a decision somebody makes rather than a consequence of merging. The tag is
# the decision, `CONTRIBUTING.md` describes making it, and everything below
# happens afterwards.
#
# ## Two ways to say it, and only one meaning
#
# Pushing `v1.2.3` triggers this. So does the "Run workflow" button, which
# takes a tag and a checkbox: leave the box unticked to publish a tag that
# already exists, tick it to have this workflow create the tag itself.
#
# Both paths converge on the same job doing the same gates against the same
# bytes, and the second is not a shortcut around the first -- it is the same
# release with the tagging moved to *after* the gates instead of before them,
# which is strictly the safer order. A hand-pushed tag is public the moment it
# is pushed, so a tree that then fails to publish leaves a tag pointing at it,
# and moving a tag people may already have fetched is the one repair this file
# refuses to make. A tag this workflow creates is written only once every gate
# has passed and the gem has been built, so a failed release leaves nothing
# behind to move.
#
# ## No API key, anywhere
#
# rubygems.org supports trusted publishing: a workflow mints a short-lived
# OIDC token, rubygems.org checks it names this repository and this workflow
# file, and exchanges it for a credential that lives for the length of one
# job. There is no `RUBYGEMS_API_KEY` secret here for the same reason there is
# no service-account key in `pages.yml` -- a long-lived key in a public
# repository's settings is one leak away from someone else publishing a gem
# under this name, and a gem is not something a user can be warned about after
# the fact. They install what rubygems.org served them.
#
# This has to be configured once on rubygems.org, under the gem's Trusted
# Publishers, naming the owner, the repository and this file. See the release
# section of `CONTRIBUTING.md`.
#
# ## Why not `rake release`
#
# `bundle exec rake release` is what a maintainer runs by hand, and it tags,
# pushes and publishes in one step, in that order. The order is the whole
# objection: it makes the tag public before anything has checked that the tree
# under it can be published, and it does the tagging from a laptop with push
# rights rather than from the run that verified the bytes. This file does the
# same three things and inverts the order -- verify, tag, publish -- so the
# tag is a record of a release that passed rather than an announcement of one
# about to be attempted.
on:
  push:
    tags: ["v*"]

  # Three jobs, and they are the same job: cutting a release without touching
  # git locally, re-running a publish that failed after the tag was already
  # public, and publishing a tag that was pushed before this workflow existed.
  #
  # `create_tag` is the difference between the first and the other two, and it
  # is a checkbox rather than an inference from whether the tag happens to
  # exist. Creating a tag is the one thing here that writes to the repository
  # and the one thing that cannot be undone quietly, so it is asked for rather
  # than arrived at -- and a re-run of a failed publish, which is the case
  # where the tag is already public, must not silently become a retag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish, e.g. v1.0.0"
        required: true
      create_tag:
        description: "Create the tag on main, if it does not exist yet"
        type: boolean
        default: false

permissions:
  contents: read

# A second run for the same tag would be pushing bytes rubygems.org has
# already accepted, and `gem push` cannot overwrite a published version: the
# duplicate fails noisily rather than doing damage. Serializing them anyway
# keeps the failure out of the logs of the run that succeeded.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Everything that can say "do not publish this" says it here, before any
  # credential is minted and before any tag is written. CI has already run on
  # `main`, but a release is a separate assertion -- a tag can point at any
  # commit in the repository, including one that was never merged -- so this
  # re-runs the gates against exactly the bytes about to be released, whether
  # a tag already names them or this run is about to.
  verify:
    name: Verify the release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      creating: ${{ steps.plan.outputs.creating }}
      sha: ${{ steps.verified.outputs.sha }}

    steps:
      # Through the environment rather than interpolated into the script.
      # `inputs.tag` is attacker-controlled text in the general case, and
      # `${{ ... }}` is substituted before bash ever sees the line -- so a tag
      # containing shell metacharacters would be executed rather than
      # compared. Every other step below reads these outputs the same way.
      - id: resolve
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RAW_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$RAW_TAG is not a vMAJOR.MINOR.PATCH tag"; exit 1 ;;
          esac
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      # What this run is going to do, decided before the checkout because the
      # checkout is the first thing that needs to know. A `push` trigger
      # always lands in the first case: the tag exists, because it is what
      # fired the run.
      #
      #   tag exists                     -> publish it, from the tag
      #   missing, create_tag ticked     -> gate main, then tag it, then publish
      #   missing, create_tag unticked   -> stop, and say which of the two was meant
      #
      # The third case is the one somebody will actually hit, and without this
      # step it lands on `actions/checkout` as "A branch or tag with the name
      # 'v1.0.1' could not be found", under a step called "Run
      # actions/checkout@v4" -- true, and it reads like the workflow is broken
      # rather than like the release is not ready.
      #
      # A ticked box against a tag that already exists is not an error. It is
      # a re-run of a release whose publish failed after the tag went public,
      # which is exactly what the button is for, so it publishes the existing
      # tag and says that is what it did. Nothing here ever moves a tag.
      - id: plan
        name: The tag exists, or is going to
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CREATE: ${{ github.event.inputs.create_tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG exists; publishing it"
            [ "$CREATE" = "true" ] && echo "(it is already tagged, so nothing is created)"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "creating=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CREATE" != "true" ]; then
            echo "::error::there is no $TAG in this repository. Either push the tag --" \
                 "see the release section of CONTRIBUTING.md, and pushing it triggers this" \
                 "workflow on its own -- or re-run this workflow with \"Create the tag on" \
                 "main\" ticked, and it will tag main for you once every gate has passed."
            exit 1
          fi
          echo "$TAG does not exist yet; gating main and tagging it if it passes"
          echo "ref=main" >> "$GITHUB_OUTPUT"
          echo "creating=true" >> "$GITHUB_OUTPUT"

      # The tag when there is one, `main` when this run is about to create it.
      # Full history either way, because the ancestry check below needs `main`
      # and a shallow clone does not have it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.ref }}
          fetch-depth: 0

      # The one commit this run is about, pinned the moment it is checked out.
      # Everything after this gates *this* sha, and the tag job below writes
      # the tag at *this* sha -- not at whatever `main` points to by the time
      # it runs. A release that quietly picked up a commit merged while the
      # suite was running would be a release nothing verified.
      - id: verified
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The tag and the constant are two statements of the same fact, written
      # in different files by different steps of a release, and a release
      # where they disagree publishes a gem whose version is not the version
      # anybody tagged. Cheapest possible check, and it has caught this
      # everywhere it has ever been written.
      - name: The tag and VERSION agree
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TAGGED_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          declared=$(ruby -r ./lib/active_sanction/version -e 'print ActiveSanction::VERSION')
          if [ "$TAGGED_VERSION" != "$declared" ]; then
            echo "::error::tag $TAG says $TAGGED_VERSION, lib/active_sanction/version.rb says $declared"
            exit 1
          fi
          echo "both say $declared"

      # A tag on a branch that never merged would publish code no review saw
      # and no `main` build ran. This is the one check that cannot be inferred
      # from the tagged tree itself.
      - name: The tag is on main
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not an ancestor of main"
            exit 1
          fi
          echo "$(git rev-parse --short HEAD) is on main"

      # Keep a Changelog, so the heading is `## [1.0.0] - 2026-09-13`. A
      # release with no entry is a release nobody can read afterwards, and the
      # section found here is what the GitHub release is written from below.
      - name: The changelog has an entry for this version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          echo "found the section"

      # The same three gates `bundle exec rake` runs, and the same three a
      # contributor runs before pushing. One Ruby rather than the matrix: the
      # matrix's job is to find what breaks across interpreters and it has
      # already done that on `main`, while this is asking a narrower question
      # -- is this specific tree publishable.
      - name: Run specs
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Typecheck with Sorbet
        run: bundle exec srb tc

      # Built here rather than in the publishing job, so the bytes that were
      # verified are the bytes that get pushed. Same reasoning as `pages.yml`
      # uploading its build for both deploys: a second build is a second
      # thing, however identical it looks.
      - name: Build the gem
        run: gem build active_sanction.gemspec

      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: "*.gem"
          retention-days: 7
          if-no-files-found: error

  # Only for a dispatch that asked for it. Skipped on every `push` release,
  # where the tag is what started the run.
  #
  # ## Why this is its own job
  #
  # It is four lines of `gh api`, and it could sit at the end of `verify`.
  # What it could not do there is keep `verify` read-only. That job runs the
  # whole test suite -- this repository's code, its development dependencies,
  # and whatever a future contributor adds to either -- and it runs it with
  # the job's token in the environment. Giving that job `contents: write` so
  # that four lines at the end of it can push a tag hands write access to
  # every line that ran before them. A separate job with nothing in it but the
  # tagging is the smallest thing that can hold the permission.
  #
  # That is the same reasoning the `publish` job below is already built on:
  # `id-token: write` lives there and nowhere else, so nothing that mints a
  # rubygems credential is in the same job as the suite either.
  tag:
    name: Tag the release
    needs: verify
    if: needs.verify.outputs.creating == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # An annotated tag object and then the ref, which is what `git tag -a`
      # writes and what `gh release create --verify-tag` expects below. Not
      # signed: a workflow has no key of the person releasing, and pretending
      # otherwise by signing with a machine key would say less than saying
      # nothing. A maintainer who wants their signature on the tag pushes it
      # themselves and leaves this box unticked -- see CONTRIBUTING.md.
      #
      # ## This does not start a second release
      #
      # Load-bearing, and invisible: a ref pushed with the repository's own
      # `GITHUB_TOKEN` does not fire workflow triggers, so the `push` event at
      # the top of this file does not see this tag. Swap this token for a PAT
      # or a GitHub App and every dispatched release starts a second one that
      # races the first to `gem push`.
      - name: Create the tag at the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="Release $VERSION" -f object="$SHA" -f type=commit \
            --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$object" >/dev/null
          echo "tagged $SHA as $TAG"

  publish:
    name: Publish to rubygems.org
    needs: [verify, tag]
    # `tag` is skipped on a `push` release, and a skipped dependency skips
    # everything downstream of it unless something says otherwise. This is
    # that: run when nothing failed and nothing was cancelled, which is the
    # ordinary reading of `needs` and not a weakening of it -- a `tag` job
    # that actually failed still stops the publish.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest

    # Named so the publish shows up on the repository's environments page with
    # its history, and so protection rules can be added later -- a required
    # reviewer on this environment turns publishing into something a second
    # person approves, without touching this file.
    environment:
      name: rubygems
      url: https://rubygems.org/gems/active_sanction/versions/${{ needs.verify.outputs.version }}

    # `id-token: write` is the whole mechanism: it mints the OIDC token
    # rubygems.org federates. Nothing else is needed, and `contents` is not
    # among them -- this job never touches the repository.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gem

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      # Exchanges the OIDC token for a rubygems.org credential scoped to this
      # gem, exports it for the step below, and revokes it when the job ends.
      #
      # Pinned to an exact version, unlike the `@v4`s elsewhere in this
      # repository. That is not a preference: this action publishes only exact
      # tags -- `v1.0.0`, `v2.0.0`, `v2.1.0` -- and no floating `v1` or `v2`
      # for them to move under. `@v2` does not resolve, and neither did the
      # `@v1` this file was first written with.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push the gem
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: gem push "active_sanction-$VERSION.gem"

      # `gem push` exiting 0 says the upload was accepted, not that the
      # version is installable -- and what a user does next is `bundle
      # install`, which asks rubygems.org rather than asking this log. So the
      # public record is what gets checked, and the check is what the
      # `announce` job below is really waiting on: it already declines to
      # announce a version that failed to publish, and ordering the jobs is
      # not the same as confirming the publish.
      #
      # The retry is not defensive padding. Indexing is asynchronous and the
      # version is queryable a few seconds after the push returns, so asking
      # once would fail on a healthy release. Two minutes is far longer than
      # that has ever taken and still bounded.
      - name: rubygems.org serves the version that was pushed
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -sf "https://rubygems.org/api/v1/versions/active_sanction.json" |
                 jq -e --arg v "$VERSION" 'any(.[]; .number == $v)' >/dev/null; then
              echo "rubygems.org serves $VERSION"
              exit 0
            fi
            echo "not indexed yet (attempt $attempt), waiting"
            sleep 10
          done
          echo "::error::rubygems.org is not serving $VERSION two minutes after the push"
          exit 1

  # Last, and deliberately after the push. A GitHub release is an
  # announcement, and announcing a version that failed to publish points
  # people at an install that does not work.
  announce:
    name: Write the GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      # The changelog is already the release note, written when the change was
      # made rather than reconstructed from commit subjects at release time.
      # This lifts the one section between this version's heading and the next
      # `## `, so the two can never drift.
      - name: Take the release note from the changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v heading="## [$VERSION]" \
            'index($0, heading) == 1 {found = 1; next} found && /^## / {exit} found' \
            CHANGELOG.md > release-note.md
          if [ ! -s release-note.md ]; then
            echo "::error::extracted an empty release note"
            exit 1
          fi
          wc -l release-note.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-note.md \
            --verify-tag
