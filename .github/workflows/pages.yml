name: Docs site

# Two jobs and one artifact. Every push to `main` publishes; every pull
# request builds the same way and runs the same link check without publishing
# anything, so a broken link is caught by the author rather than by a reader
# (#103).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "lib/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "bin/readme_linkcheck"
      - ".yardopts"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

# A queued deploy should wait for the one in flight rather than race it, and a
# superseded one should be dropped -- but never cancel a deploy that is
# already writing, which is what `cancel-in-progress: false` is for.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Two toolchains, because the site genuinely needs both: Astro builds
      # the handwritten pages, and YARD renders the generated API reference
      # out of the library's own signatures. Neither is a dependency of the
      # gem, and nothing here ships.
      - name: Ruby, for the generated API documentation
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # `--fail-on-warning` is in the rake task, so a broken cross-reference
      # fails here rather than publishing as a dead link. Since #62 this
      # renders the public surface only, and it is 100% documented.
      - name: Render the API documentation
        run: bundle exec rake doc

      # Pinned, and deliberately not the gem's Ruby matrix. The library is
      # built on every Ruby from 3.1 to 4.0; the site is one artifact built
      # once, and Astro's own floor has nothing to do with what
      # `active_sanction` supports.
      - name: Node, for the site
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the site's dependencies
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      # Under `/api/`, which is where the navigation points and where the
      # handwritten reference links into rather than restating a signature.
      # Copied rather than built by Astro: 600 generated files have no front
      # matter and nothing for a content collection to do.
      - name: Publish the API documentation under /api/
        run: |
          mkdir -p site/dist/api
          cp -R doc/. site/dist/api/

      # After the copy, so the navigation's own link to `/api/` is one of the
      # links being checked -- which is what catches a deploy that forgot it.
      #
      # `--ignore api` skips that directory as a *source* of links while
      # leaving it a valid *target*. YARD renders the README as its index
      # page, and every relative link in the README resolves against the
      # repository rather than against this site; crawling it reports 126
      # broken links that are all correct where they are written.
      - name: Check every internal link and anchor
        run: bundle exec ruby site/bin/linkcheck site/dist --ignore api

      # The README is read on the repository page and inside an installed
      # gem, neither of which is this build -- so the crawl above never sees
      # it. This runs in the same job, after the site is built, so a link
      # from the README into a page or anchor this site actually publishes
      # is checked against the real thing rather than guessed at (#108).
      - name: Check every link in the README
        run: bundle exec ruby bin/readme_linkcheck README.md site/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      # The same bytes again, in an ordinary artifact. `upload-pages-artifact`
      # produces a tarball only `deploy-pages` knows how to read, and the
      # babystep.tech job needs the directory. Uploading twice costs a few
      # seconds and is the only way both deploys are guaranteed to publish
      # the build that was link-checked, rather than two separate builds.
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

  deploy:
    name: Deploy
    # Pull requests build and check; only the trunk publishes. A fork's pull
    # request could not deploy anyway -- it has no write token -- and this
    # makes that a property of the workflow rather than of the permissions.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # babystep.tech is not GitHub Pages. It is a React site in a Cloud Storage
  # bucket behind a Google Cloud load balancer whose URL map has exactly one
  # rule: everything goes to that bucket. So publishing the documentation
  # under `babystep.tech/active_sanction/` needs no load balancer change at
  # all -- only objects under an `active_sanction/` prefix. The bucket already
  # sets `mainPageSuffix: index.html`, which is what makes a directory URL
  # like `/active_sanction/tutorial/` resolve, and its default object ACL
  # already grants `allUsers: READER`, so uploads are public without this job
  # setting an ACL.
  publish-babystep-tech:
    name: Publish to babystep.tech
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: babystep-tech
      url: https://babystep.tech/active_sanction/

    # `id-token: write` is the whole point: it mints the OIDC token Google
    # federates. There is no service-account key anywhere in this repository,
    # which matters more than usual now that the repository is public.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Copied rather than rsynced, deliberately. This bucket also serves the
      # marketing site, and `rsync --delete-unmatched-destination-objects`
      # against an empty or mistyped prefix would take that site with it. The
      # cost of copying is that superseded hashed assets accumulate under the
      # prefix; they are unreferenced and harmless, and no correctness
      # depends on them being gone.
      - name: Upload the built site under /active_sanction
        run: |
          gcloud storage cp --recursive --cache-control="public, max-age=3600" \
            site-dist/* "gs://${{ vars.DOCS_BUCKET }}/active_sanction/"

      # Cloud CDN caches on CACHE_ALL_STATIC with an hour's default TTL, so
      # without this a publish is live somewhere between immediately and an
      # hour from now. Scoped to the prefix: invalidating `/*` would evict the
      # marketing site's cache too, for no reason.
      - name: Invalidate the CDN for the docs path only
        run: |
          gcloud compute url-maps invalidate-cdn-cache "${{ vars.DOCS_URL_MAP }}" \
            --project="${{ vars.DOCS_URL_MAP_PROJECT }}" \
            --path="/active_sanction/*" --async
