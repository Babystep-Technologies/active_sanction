name: CI

# Push builds cover the trunk; pull_request covers everything on the way in.
# Limiting push to `main` keeps same-repo PRs from building twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every released Ruby the gem claims to support, floor first. The floor
        # is the gemspec's `required_ruby_version` and the last entry is what
        # `.ruby-version` says this gem is developed on -- neither of which is
        # allowed to drift away from this list, because
        # spec/supported_rubies_spec.rb reads this file, `.ruby-version`, the
        # gemspec and `.rubocop.yml` and fails when they stop agreeing.
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]

        # The one entry that is not a promise. `ruby-head` is here so that a
        # change upstream reports before it is released rather than after, and
        # it is deliberately outside the list above: the guard spec reads
        # `ruby:` only, so this never counts as a Ruby the gem supports.
        #
        # It is also the slow job. There is no precompiled nokogiri or sqlite3
        # for a `4.1.0dev` interpreter, so it builds both from source, and a
        # gem that has not caught up with head yet fails here first.
        include:
          - ruby: "ruby-head"
            experimental: true

    # `ruby-head` reports; it does not gate. A break upstream is news rather
    # than a broken build, so that job turns red in the checks list and leaves
    # the workflow -- and the badge -- green. The released Rubies carry no
    # `experimental`, so for every one of them this is `false` and a failure is
    # a failure.
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - uses: actions/checkout@v4

      # `ruby-version` here wins over the checked-in `.ruby-version`, so the
      # matrix drives the build. `bundler-cache: true` installs the bundle and
      # caches it; `Gemfile.lock` is gitignored, so each Ruby resolves its own.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # `spec_helper.rb` excludes `:live` by default, so this is the hermetic
      # suite: committed fixtures with WebMock blocking outbound connections.
      # Specs that hit real government endpoints stay opt-in behind
      # `bundle exec rspec --tag live` and are deliberately never run in CI --
      # a red build should mean our code broke, not that a source went down.
      - name: Run specs
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

      # `lib/` is `typed: strict` and the RBIs it is checked against are
      # committed under `sorbet/`, so this needs nothing beyond the bundle --
      # no code is loaded and nothing is generated. It runs on every Ruby in
      # the matrix rather than once, because that is what makes a type error
      # attributable to the build that found it rather than to a separate job.
      - name: Typecheck with Sorbet
        run: bundle exec srb tc
