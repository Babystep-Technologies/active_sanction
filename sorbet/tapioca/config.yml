gem:
  # RBIs are generated for what `lib/` can reach, which is what `srb tc`
  # checks -- see sorbet/config. The gems below only ever run the suite, the
  # linter or the checker itself: nothing in `lib/` names a constant from any
  # of them, and generating their RBIs would add several megabytes of files
  # that exist only to be parsed and ignored on every run.
  exclude:
  - addressable
  - ast
  - crack
  - diff-lcs
  - hashdiff
  - language_server-protocol
  - lint_roller
  - netrc
  - parallel
  - parser
  - prism
  - public_suffix
  - rainbow
  - rake
  - rbi
  - rbs
  - regexp_parser
  - require-hooks
  - rspec
  - rspec-core
  - rspec-expectations
  - rspec-mocks
  - rspec-support
  - rubocop
  - rubocop-ast
  - rubocop-rspec
  - ruby-progressbar
  - rubydex
  - spoom
  - tapioca
  - thor
  - unicode-display_width
  - unicode-emoji
  - webmock
dsl:
  # Add your `dsl` command parameters here:
  #
  # exclude:
  # - SomeGeneratorName
  # workers: 5
