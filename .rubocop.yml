plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

# The codebase uses double quotes throughout, as the bundler gem template does.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# The gemspec is generated boilerplate with long metadata strings.
Layout/LineLength:
  Max: 120
  Exclude:
    - "active_sanction.gemspec"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*_spec.rb"
    - "active_sanction.gemspec"

Style/Documentation:
  Enabled: false

RSpec/ExampleLength:
  Max: 10

# These files cover the test harness itself rather than a class:
# network_isolation_spec that the suite cannot reach the internet, and the two
# conformance specs the shared example groups that every source adapter and
# every storage adapter are held to.
RSpec/DescribeClass:
  Exclude:
    - "spec/network_isolation_spec.rb"
    - "spec/active_sanction/sources/conformance_spec.rb"
    - "spec/active_sanction/storage/conformance_spec.rb"

# The canonical model is value objects: one keyword argument and one hash key
# per field. Splitting `initialize` or `to_h` to satisfy a count would make
# them harder to read, not easier.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The same rule, one level down. Entity's `initialize` and `to_h` grow by
# exactly one assignment and one hash key for every field the canonical record
# gains, so their ABC size measures how many fields a sanctions record has and
# nothing else. Splitting either in half to satisfy the count would make them
# harder to read, not easier.
#
# The same rule holds for the two halves of the ActiveRecord adapter that turn
# a canonical record into a row and a row back into a canonical record: both
# grow by exactly one column and one hash key per field the record has.
Metrics/AbcSize:
  Exclude:
    - "lib/active_sanction/entity.rb"
    - "lib/active_sanction/storage/active_record/reader.rb"
    - "lib/active_sanction/storage/active_record/writer.rb"

Metrics/MethodLength:
  Max: 15

# Value objects run long by construction: every field costs a keyword argument,
# a reader, a validation, a #to_h key and a line of documentation. Splitting one
# record's rules across two classes to satisfy a line count would make them
# harder to find, not easier. The parsing vocabulary that genuinely is a second
# job already lives in its own class (PartialDate::Parser).
Metrics/ClassLength:
  Max: 140
