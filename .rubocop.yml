plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

# The codebase uses double quotes throughout, as the bundler gem template does.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# The gemspec is generated boilerplate with long metadata strings.
Layout/LineLength:
  Max: 120
  Exclude:
    - "active_sanction.gemspec"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*_spec.rb"
    - "active_sanction.gemspec"

Style/Documentation:
  Enabled: false

RSpec/ExampleLength:
  Max: 10

# These files cover the test harness itself rather than a class:
# network_isolation_spec that the suite cannot reach the internet,
# sorbet_runtime_spec what a signature does and does not do in a host's
# process, and the two conformance specs the shared example groups that every
# source adapter and every storage adapter are held to.
RSpec/DescribeClass:
  Exclude:
    - "spec/network_isolation_spec.rb"
    - "spec/sorbet_runtime_spec.rb"
    - "spec/active_sanction/sources/conformance_spec.rb"
    - "spec/active_sanction/storage/conformance_spec.rb"

# The canonical model is value objects: one keyword argument and one hash key
# per field. Splitting `initialize` or `to_h` to satisfy a count would make
# them harder to read, not easier.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The same rule, one level down. Entity's `initialize` and `to_h` grow by
# exactly one assignment and one hash key for every field the canonical record
# gains, so their ABC size measures how many fields a sanctions record has and
# nothing else. Splitting either in half to satisfy the count would make them
# harder to read, not easier.
#
# The same rule holds for the two halves of the ActiveRecord adapter that turn
# a canonical record into a row and a row back into a canonical record: both
# grow by exactly one column and one hash key per field the record has.
#
# Sorbet's `T.let` is why the ceiling moved from 17 to 28 (#73). Declaring an
# instance variable's type is a method call, so ABC counts one branch per
# member on top of the assignment it already counted -- which means a value
# object's constructor now scores roughly twice what it did for exactly the
# same code. What is left measured is the thing worth measuring: a method that
# branches, rather than one that copies a record's fields into itself.
Metrics/AbcSize:
  Max: 28
  Exclude:
    - "lib/active_sanction/entity.rb"
    # Configuration#initialize is the same shape as a value object's: one
    # `T.let` per setting the library has, and nothing else.
    - "lib/active_sanction/configuration.rb"
    - "lib/active_sanction/storage/active_record/reader.rb"
    - "lib/active_sanction/storage/active_record/writer.rb"
    # A transcription rather than a design -- see the note on
    # Metrics/CyclomaticComplexity below.
    - "lib/active_sanction/phonetics/double_metaphone.rb"

# A constructor now declares the type of each instance variable it assigns,
# which is what carries the longest of them past fifteen lines (#73).
Metrics/MethodLength:
  Max: 18
  Exclude:
    # See the note on Metrics/CyclomaticComplexity below.
    - "lib/active_sanction/phonetics/double_metaphone.rb"
    # Configuration#initialize for the reason Metrics/AbcSize excludes it: one
    # `T.let` per setting the library has, and nothing else. It passed 18 lines
    # when sync orchestration (#34) added `sync_concurrency`.
    - "lib/active_sanction/configuration.rb"

# Value objects run long by construction: every field costs a keyword argument,
# a reader, a validation, a #to_h key and a line of documentation. Splitting one
# record's rules across two classes to satisfy a line count would make them
# harder to find, not easier. The parsing vocabulary that genuinely is a second
# job already lives in its own class (PartialDate::Parser).
#
# 140 became 190 with #73: a reader is now two lines rather than one, because
# the `sig` above it says what it returns.
#
# Configuration is the same shape for a different reason: it grows by a reader,
# a writer and a validation for every setting the library gains, and a setting
# whose invalid values raise a message worth reading costs more than three
# lines. 190 became 210 when the normalizer dictionary (#27) became
# configurable, 210 became 225 when the index (#31) added its candidate cap,
# and 225 became 235 for the scorer's weights (#32) -- the same three lines
# per setting, each time. 235 became 275 for the public screening API (#33),
# which added three: the store lists are read from, and the threshold and
# result limit a screening call defaults to. 275 became 295 for sync
# orchestration (#34), which added `sync_concurrency` and the shared validation
# a per-run `concurrency:` is held to.
Metrics/ClassLength:
  Max: 295
  Exclude:
    # See the note on Metrics/CyclomaticComplexity below.
    - "lib/active_sanction/phonetics/double_metaphone.rb"

# The same rule for the one module that carries as much declaration as a class:
# Sources::Definition is a reader and a writer for every declaration a source
# adapter makes, each of which now carries a signature.
Metrics/ModuleLength:
  Max: 130

# The one file in the library that is a transcription rather than a design.
#
# Double Metaphone is a table of roughly a hundred special cases about how
# letters are pronounced in English, German, Slavic, Romance and Greek
# spellings. None of it can be derived; it can only be compared, rule for
# rule, against the reference implementation it came from -- which is why the
# file keeps that implementation's order and its section comments, and why
# the specs check the output against several thousand of its own values.
#
# `letter_c` scores 14 on complexity because the letter C has fourteen
# contexts, and every branch of it is a line of Philips' C. Splitting it to
# reach a 7 would put those branches in an order nobody can check against
# anything, and a wrong phonetic key does not fail -- it quietly stops a name
# from being found. The metrics are measuring the algorithm here rather than
# the code, so they are turned off for this path and nothing else.
Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/active_sanction/phonetics/double_metaphone.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/active_sanction/phonetics/double_metaphone.rb"

# Both of these want `def each(&)` and `foo(&)`, and Sorbet cannot sign an
# anonymous block: a `sig` names every parameter, so a block a method forwards
# has to have a name to be named. The signature is worth more than the
# shorthand -- it is what says what the block is called with.
Naming/BlockForwarding:
  EnforcedStyle: explicit

Style/ArgumentsForwarding:
  UseAnonymousForwarding: false
